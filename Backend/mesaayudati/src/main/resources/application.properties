spring.application.name=mesaayudati

# H2 persistente permite ejecutar el proyecto localmente sin instalar MySQL.
# En despliegue, configura DB_URL, DB_USERNAME y DB_PASSWORD para usar MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mesaayudati;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-stacktrace=never

# Cambia JWT_SECRET por una clave secreta propia en cualquier despliegue.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy-123456789}
app.jwt.expiration-seconds=3600
app.bootstrap-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:admin@local.test}
app.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
