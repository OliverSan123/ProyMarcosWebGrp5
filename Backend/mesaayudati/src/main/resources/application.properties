spring.application.name=mesaayudati
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesaayudati}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-stacktrace=never

# Cambia JWT_SECRET por una clave secreta propia en cualquier despliegue.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy-123456789}
app.jwt.expiration-seconds=3600
app.bootstrap-admin.username=${INITIAL_ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:admin@local.test}
app.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap-test-users.password=${INITIAL_TEST_USERS_PASSWORD:}
app.bootstrap-test-users.reset-existing=${RESET_EXISTING_USERS:false}
