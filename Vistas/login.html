<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="/Estilos/estilo-login.css">
</head>

<body>

    <main>
        <!--LOGO-->
        <div class="logo">
            <!--bootstrap-->
            <img src="/Imagenes/logoEmpresa.png" class="float-start img-fluid" alt="Logo-empresa">
        </div>


        <!--FORMULARIO DE INGRESO-->
        <div class="formulario">
            <form>

                <!--bootstrap-->
                <div class="form-group">
                    <!--bootstrap-->
                    <label for="User" class="fw-bold">Usuario</label>
                    <input type="text" class="form-control" id="user" aria-describedby="userHelp"
                        placeholder="Ingrese su usuario">

                </div>

                <!--bootstrap-->
                <div class="form-group">
                    <!--bootstrap-->
                    <label for="Password" class="fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
                    <!--bootstrap-->
                    <small id="emailHelp" class="form-text text-muted">
                        No compartas tu contraseña con alguien
                        más.
                    </small>
                </div>

                <!--bootstrap-->
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="RecordarUsuario" data-bs-toggle="modal"
                        data-bs-target="#miModal">
                    <label class="form-check-label" for="recordarUsuario">Recuérdame</label>
                </div>

                <!--bootstrap-->
                <div class="d-grid">
                    <a href="/Vistas/dashboard.html" class="btn btn-info" role="button">
                        Ingresar
                    </a>
                </div>

                <!--bootstrap-->
                <div class="modal fade" id="miModal" tabindex="-1" aria-labelledby="miModalLabel" aria-hidden="true"
                    style="display: none;">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-body">USUARIO Y CONTRASEÑA GUARDADOS</div>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
