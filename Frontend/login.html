<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <main>
        <!--BANNER-->
        <div class="banner-login">
            <div class="imagen">
                <img src="Imagenes\logoEmpresa.png" class="rounded-circle float-start img-fluid"
                alt="imagen flotante a la izquierda">
            </div>
        </div>
        

        <!--FORMULARIO DE INGRESO-->
        <div class="container-fluid">
            <form>
                <div class="form-group">
                    <label for="User">Usuario</label>
                    <input type="text" class="form-control" id="Usuario" aria-describedby="userHelp"
                        placeholder="Ingrese su usuario">

                </div>
                <div class="form-group">
                    <label for="Password">Contraseña</label>
                    <input type="password" class="form-control" id="Contraseña" placeholder="Ingrese su contraseña">
                    <small id="emailHelp" class="form-text text-muted">No compartas tu contraseña con alguien
                        más.</small>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="RecordarUsuario">
                    <label class="form-check-label" for="recordarUsuario">Recuérdame</label>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
